<script>
  // Interactive Play/Pause Toggle
  const playPauseBtn = document.getElementById('play-pause-btn');
  const playPauseIcon = document.getElementById('play-pause-icon');
  let isPlaying = true;

  if (playPauseBtn && playPauseIcon) {
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playPauseIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      playPauseBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
      
      const bars = document.querySelectorAll('#waveform-container span');
      bars.forEach(bar => {
        if (!isPlaying) {
          bar.classList.add('opacity-70');
        } else {
          bar.classList.remove('opacity-70');
        }
      });
    });
  }

  // Favorite Heart Toggle with Tactile Fill
  const favBtn = document.getElementById('favorite-btn');
  const favIcon = document.getElementById('fav-icon');
  let isFav = false;

  if (favBtn && favIcon) {
    favBtn.addEventListener('click', () => {
      isFav = !isFav;
      if (isFav) {
        favIcon.style.fontVariationSettings = "'FILL' 1";
        favBtn.classList.remove('text-secondary');
        favBtn.classList.add('text-primary');
      } else {
        favIcon.style.fontVariationSettings = "'FILL' 0";
        favBtn.classList.remove('text-primary');
        favBtn.classList.add('text-secondary');
      }
    });
  }

  // Shuffle & Repeat Active States
  const shuffleBtn = document.getElementById('shuffle-btn');
  const repeatBtn = document.getElementById('repeat-btn');

  [shuffleBtn, repeatBtn].forEach(btn => {
    if (btn) {
      btn.addEventListener('click', () => {
        btn.classList.toggle('text-secondary');
        btn.classList.toggle('text-primary');
        btn.classList.toggle('bg-surface-container-low');
      });
    }
  });
</script></main><div class="fixed bottom-0 w-full pb-safe flex justify-center pointer-events-none"><div class="w-32 h-1 bg-on-surface/20 rounded-full my-1.5"></div></div></body></html>
