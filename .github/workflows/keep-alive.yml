name: Keep Render Awake

# Pings the live website every 5 minutes so the Render free service
# never spins down from inactivity (free Web Services sleep after 15 min).
#
# NOTE: Render *Static Sites* never sleep — this pinger only matters if the
# site is (or becomes) a Render *Web Service*. Safe to keep running anyway.
#
# URL resolution:
#   1. Repo variable SITE_URL (Settings → Secrets and variables → Actions → Variables)
#   2. Falls back to the default below — edit it if the Render URL changes.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {} # manual "Run workflow" button for testing

permissions:
  contents: none

concurrency:
  group: keep-alive

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site
        run: |
          URL="${{ vars.SITE_URL || 'https://myplayer-660ee.web.app' }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "Ping $URL → HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::warning::Could not reach the site (network/timeout). Not failing the run."
          elif [ "$code" != "200" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "::error::Unexpected status HTTP $code from $URL"
            exit 1
          fi
