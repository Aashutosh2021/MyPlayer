<style>
        /* Claymorphic Utility Classes */
        .clay-outer-soft {
            box-shadow: 0 40px 40px rgba(0, 87, 194, 0.1);
        }
        
        .clay-inner-convex {
            box-shadow: inset 4px 4px 8px rgba(255, 255, 255, 0.8), inset -6px -6px 12px rgba(0, 0, 0, 0.05), 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .clay-inner-concave {
            box-shadow: inset -2px -2px 4px rgba(255, 255, 255, 1), inset 4px 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .clay-card-border {
            border: 1px solid rgba(0, 87, 194, 0.05);
        }

        /* Custom Range Slider Styling for Webkit */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            margin-top: -8px; 
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.9), inset -2px -2px 6px rgba(0, 0, 0, 0.1), 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #ecedf7; /* surface-container */
            border-radius: 8px;
            box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.1), inset -2px -2px 4px rgba(255, 255, 255, 0.8);
        }
        
        /* Interaction States */
        .btn-pressable {
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .btn-pressable:active {
            transform: scale(0.95);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.1), inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Top Navigation (Contextual departure) -->
<header class="flex items-center justify-between w-full max-w-7xl mx-auto px-container-padding pt-xs pb-xs bg-transparent">

<!-- Main Content Canvas -->
